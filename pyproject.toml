[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
index-url = "https://download.pytorch.org/whl/cu118"
extra-index-url = ["https://pypi.org/simple"]

[tool.uv.sources]
nas-path-package = { git = "https://github.com/WayScience/playbooks.git", subdirectory = "internal/nas_path_package" }

[project]
name = "nf1-organoid-profile-analysis"
version = "0.1.0"
description = "NF1 organoid profile analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arrow>=1.4.0",
    "iprogress>=0.4",
    "ipykernel>=6.31.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.11.1",
    "microfilm>=0.3.0",
    "numba>=0.66.0",
    "numpy>=2.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tomli>=2.4.0",
    "certifi>=2026.5.20",
    "statsmodels>=0.14.6",
    "tqdm>=4.70.0",
    "jupyter>=1.1.1",
    "umap-learn>=0.5.12",
    "pycytominer>=1.7.1",
    "streamlit>=1.40",
    "plotly>=6",
    "kaleido>=1.0",
    "nas-path-package",
    "scipy>=1.17.1",
    "huggingface-hub>=2.1.1",
]


[tool.pycln]
all = true

[tool.setuptools]
packages = []
